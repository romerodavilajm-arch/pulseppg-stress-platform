<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PulsePPG{% endblock %}</title>
  {% block head %}{% endblock %}
  <link href="/static/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar bg-white border-bottom mb-4">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{% block home %}/{% endblock %}">PulsePPG</a>
      {% block nav %}{% endblock %}
    </div>
  </nav>
  <main class="container pb-5">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
