# ============================================================
# PulsePPG Stress Platform — Servicios Docker
# Incluye la base de datos, Mosquitto, el Ingestor y el Analyzer HRV.
# La API se añadirá como servicio en esta misma red.
# ============================================================

services:
  db:
    image: timescale/timescaledb:2.30.2-pg16
    container_name: pulseppg-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulseppg}
      POSTGRES_USER: ${POSTGRES_USER:-pulseppg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulseppg}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # init.sql solo se ejecuta cuando el volumen está vacío.
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - pgdata:/var/lib/postgresql/data
    # -h 127.0.0.1 fuerza TCP: durante la ejecución de init.sql el servidor
    # temporal solo escucha por socket, así no se marca sano antes de tiempo.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pulseppg

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    container_name: pulseppg-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pulseppg

  ingestor:
    build: ./ingestor
    container_name: pulseppg-ingestor
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-pulseppg}
      PGUSER: ${POSTGRES_USER:-pulseppg}
      PGPASSWORD: ${POSTGRES_PASSWORD:-pulseppg}
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - pulseppg

  analyzer:
    build: ./analyzer
    container_name: pulseppg-analyzer
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      POLL_SECONDS: ${ANALYZER_POLL_SECONDS:-60}
      HRV_SQI_MIN: ${HRV_SQI_MIN:-0.86}
      HRV_PI_MIN: ${HRV_PI_MIN:-0.1}
      HRV_SNR_MIN_DB: ${HRV_SNR_MIN_DB:-0}
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-pulseppg}
      PGUSER: ${POSTGRES_USER:-pulseppg}
      PGPASSWORD: ${POSTGRES_PASSWORD:-pulseppg}
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - pulseppg

volumes:
  pgdata:
  mosquitto-data:

networks:
  pulseppg:
